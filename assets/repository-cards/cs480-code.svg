<svg xmlns="http://www.w3.org/2000/svg" width="470" height="190" viewBox="0 0 470 190" role="img" aria-labelledby="title desc">
  <title id="title">CS480-Code repository card</title>
  <desc id="desc">Collaborative directions application combining a Rust backend with browser-based interface components.</desc>

  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030303"/>
      <stop offset="68%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#230707"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".025"/>
    </pattern>
    <style>
      .title { fill:#ffffff; font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
      .owner { fill:#f87171; font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; letter-spacing:1px; }
      .description { fill:#c7c7c7; font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
      .tag { fill:#fecaca; font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
      .meta { fill:#9ca3af; font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
      .arrow { fill:#ef4444; font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
    </style>
  </defs>

  <rect x="5" y="7" width="460" height="180" rx="10" fill="#000000" opacity=".55"/>
  <rect x="3" y="3" width="464" height="180" rx="10" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="2"/>
  <rect x="3" y="3" width="464" height="180" rx="10" fill="url(#microGrid)"/>
  <path d="M3 3h185l-24 8H3z" fill="#dc2626"/>
  <path d="M467 183H290l24-8h153z" fill="#7f1d1d"/>

  <rect x="20" y="21" width="34" height="34" rx="4" fill="#180303" stroke="#dc2626"/>
  <path d="M29 30h16v3H29zm0 7h11v3H29zm0 7h16v3H29z" fill="#ef4444"/>

  <text x="66" y="32" class="owner">MAXSHUFORD / REPOSITORY</text>
  <text x="66" y="57" class="title">CS480-Code</text>
  <text x="438" y="46" class="arrow">↗</text>

  <text x="28" y="80" class="description">Collaborative directions application combining a Rust backend</text>
<text x="28" y="101" class="description">with browser-based interface components.</text>

  <rect x="28" y="132" width="67" height="25" rx="4" fill="#220707" stroke="#dc2626"/><text x="61.5" y="149" text-anchor="middle" class="tag">Routing</text><rect x="104" y="132" width="109" height="25" rx="4" fill="#120303" stroke="#7f1d1d"/><text x="158.5" y="149" text-anchor="middle" class="tag">Collaboration</text><rect x="222" y="132" width="64" height="25" rx="4" fill="#220707" stroke="#dc2626"/><text x="254.0" y="149" text-anchor="middle" class="tag">Web UI</text>

  <circle cx="31" cy="174" r="5" fill="#dc2626"/>
  <text x="43" y="178" class="meta">Rust</text>
  <text x="442" y="178" text-anchor="end" class="meta">OPEN PROJECT</text>
</svg>
