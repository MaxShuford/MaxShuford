name: Update README statistics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &rank_icon=github
            &bg_color=050505
            &title_color=ef4444
            &text_color=f3f4f6
            &icon_color=dc2626
            &border_color=7f1d1d
          path: assets/stats/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=8
            &size_weight=0.5
            &count_weight=0.5
            &bg_color=050505
            &title_color=ef4444
            &text_color=f3f4f6
            &border_color=7f1d1d
          path: assets/stats/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          git commit -m "Update README statistics" || exit 0
          git push
